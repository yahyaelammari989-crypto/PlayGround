<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10162e"><title>صيّاد النجوم</title>
<style>
:root{color-scheme:dark;--muted:#a9abc7;--gold:#ffcf70}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;color:#f7f5ff}body{min-height:100svh;background:radial-gradient(ellipse at 50% 110%,#49316e,#24264c 38%,#10162e 78%);display:flex;justify-content:center;align-items:center;padding:22px}.app{width:min(100%,1020px)}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.brand{display:flex;align-items:center;gap:12px}.brand-icon{height:48px;width:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#ffda85,#ff9d67);font-size:26px}.brand h1{font-size:24px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px;letter-spacing:1px}.best-pill,.hud-icon{border:1px solid #ffffff1b;background:#ffffff0b;padding:9px 14px;border-radius:14px;color:#dedbf1}.best-pill b{color:var(--gold);font-family:system-ui;margin-right:5px}.game-shell{border:1px solid #ffffff20;background:linear-gradient(150deg,#ffffff0e,#ffffff04);padding:12px;border-radius:25px;box-shadow:0 25px 80px #080b1b8c}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:3px 8px 12px}.hud-card{display:flex;align-items:center;gap:9px}.hud-card.center{justify-content:center}.hud-card.end{justify-content:flex-start}.hud-icon{height:36px;width:36px;padding:0;display:grid;place-items:center}.hud-label{color:var(--muted);font-size:11px}.hud-value{font-size:19px;font-weight:800}.lives{direction:ltr;white-space:nowrap}.lives .lost{opacity:.22;filter:grayscale(1)}
.stage{position:relative;overflow:hidden;border-radius:17px;background:#151b3d;aspect-ratio:16/9;min-height:270px;touch-action:none;user-select:none}.stage canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#13183199;padding:20px;transition:opacity .2s,visibility .2s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.dialog{width:min(390px,100%);text-align:center;padding:25px;border:1px solid #ffffff24;background:linear-gradient(145deg,#28264bdd,#1d2345ee);border-radius:24px}.dialog-emoji{font-size:45px}.dialog h2{font-size:24px;margin:0 0 6px}.dialog p{margin:0 auto 17px;color:#c0c1d9;font-size:14px;line-height:1.8}.primary{border:0;border-radius:14px;padding:12px 27px;background:linear-gradient(135deg,#ffc969,#ff9f70);color:#32233d;font:bold 16px system-ui;cursor:pointer}.hint{color:#a7a9c5;font-size:11px;margin-top:12px}.pause-button{position:absolute;z-index:2;top:12px;left:12px;width:37px;height:37px;border:1px solid #ffffff25;border-radius:12px;background:#141a36aa;color:white;cursor:pointer}.pause-button:disabled{opacity:.38}.bottomrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 6px 1px;color:#b8bad2;font-size:12px}.mobile-controls{display:none;gap:10px;direction:ltr}.move-btn{height:46px;width:62px;border:1px solid #ffffff24;border-radius:15px;background:#ffffff0d;color:white;font-size:22px;touch-action:none;user-select:none}.credit{opacity:.62;font-size:11px;direction:ltr}
@media(max-width:650px){body{padding:14px 12px}.topbar{margin-bottom:12px}.brand-icon{width:42px;height:42px}.brand h1{font-size:21px}.best-pill{padding:7px 10px;font-size:11px}.game-shell{padding:9px;border-radius:21px}.hud{padding:1px 5px 9px}.hud-icon{width:31px;height:31px}.hud-value{font-size:17px}.stage{aspect-ratio:4/3;min-height:250px;max-height:58svh}.mobile-controls{display:flex}.move-btn{height:42px;width:52px}.credit{display:none}.dialog{padding:20px 17px}.dialog h2{font-size:21px}}@media(max-width:380px){body{padding-inline:8px}.stage{min-height:225px}.hud-card{gap:5px}}
</style>
</head>
<body><main class="app"><header class="topbar"><div class="brand"><div class="brand-icon">🧺</div><div><h1>صيّاد النجوم</h1><p>STAR CATCHER</p></div></div><div class="best-pill">🏆 أحسن نتيجة <b id="best">0</b></div></header>
<section class="game-shell"><div class="hud"><div class="hud-card"><div class="hud-icon">✨</div><div><div class="hud-label">النقاط</div><div class="hud-value" id="score">000</div></div></div><div class="hud-card center"><div><div class="hud-label">المستوى</div><div class="hud-value" id="level">1</div></div></div><div class="hud-card end"><div><div class="hud-label">القلوب</div><div class="lives" id="lives">❤️❤️❤️</div></div></div></div>
<div class="stage"><canvas id="game" width="960" height="540" aria-label="مساحة اللعب"></canvas><button class="pause-button" id="pause" aria-label="إيقاف مؤقت" disabled>Ⅱ</button><div class="overlay" id="overlay"><div class="dialog"><div class="dialog-emoji" id="dialogEmoji">🌟</div><h2 id="dialogTitle">واجد تجمع النجوم؟</h2><p id="dialogText">حرّك السلة، جمع النجوم والذهب، وبعّد على القنابل! شحال تقدر تصمد؟</p><button class="primary" id="play">يلا نلعب!</button><div class="hint">استعمل الأسهم ← → أو حرّك السلة باللمس</div></div></div></div>
<div class="bottomrow"><span>💡 النجوم كيزيدوك نقاط — القنابل كتنقصك قلب!</span><div class="mobile-controls"><button class="move-btn" id="left">←</button><button class="move-btn" id="right">→</button></div><span class="credit">CATCH THE GOOD ✦ DODGE THE BAD</span></div></section></main>
<script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),overlay=$('overlay'),scoreEl=$('score'),levelEl=$('level'),livesEl=$('lives'),bestEl=$('best'),playBtn=$('play'),pauseBtn=$('pause'),W=960,H=540;let state='ready',score=0,lives=3,best=0,level=1,items=[],particles=[],keys={},last=0,spawnTimer=0,elapsed=0,shake=0;const player={x:W/2,target:W/2,y:465,w:108,h:68,speed:690};try{best=Number(localStorage.getItem('starCatcherBest'))||0}catch(e){}bestEl.textContent=best;const rand=(a,b)=>a+Math.random()*(b-a);
function start(){score=0;lives=3;items=[];particles=[];elapsed=0;spawnTimer=.45;player.x=player.target=W/2;player.hitUntil=0;state='playing';overlay.classList.add('hidden');pauseBtn.disabled=false;pauseBtn.textContent='Ⅱ';updateHud()}function updateHud(){scoreEl.textContent=String(score).padStart(3,'0');level=Math.floor(score/10)+1;levelEl.textContent=level;livesEl.innerHTML=[0,1,2].map(i=>`<span class="${i>=lives?'lost':''}">❤️</span>`).join('')}function endGame(){state='over';pauseBtn.disabled=true;overlay.classList.remove('hidden');$('dialogEmoji').textContent='💫';$('dialogTitle').textContent='سالاو القلوب!';$('dialogText').textContent=`جمعتي ${score} نقاط — واش تقدر تحطم رقمك القياسي؟`;playBtn.textContent='عاود اللعب';if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('starCatcherBest',best)}catch(e){}}}function pause(){if(state==='playing'){state='paused';pauseBtn.textContent='▶';$('dialogEmoji').textContent='⏸️';$('dialogTitle').textContent='وقفنا شوية';$('dialogText').textContent='السلة ديالك محتافظا بمكانها. واجد تكمل؟';playBtn.textContent='كمّل اللعب';overlay.classList.remove('hidden')}else if(state==='paused'){state='playing';pauseBtn.textContent='Ⅱ';overlay.classList.add('hidden')}}playBtn.addEventListener('click',()=>state==='paused'?pause():start());pauseBtn.addEventListener('click',pause);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','Escape'].includes(e.key))e.preventDefault();keys[e.key]=true;if((e.key===' '||e.key==='Escape')&&state==='playing')pause();else if((e.key===' '||e.key==='Enter')&&(state==='ready'||state==='over'))start()});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>{keys={};if(state==='playing')pause()});function setTarget(e){const r=canvas.getBoundingClientRect();player.target=Math.max(52,Math.min(W-52,(e.clientX-r.left)*W/r.width))}canvas.addEventListener('pointerdown',e=>{if(state==='playing'){setTarget(e);canvas.setPointerCapture?.(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(state==='playing'&&(e.pointerType==='mouse'||e.buttons))setTarget(e)});function bindMove(id,dir){const b=$(id),down=e=>{e.preventDefault();keys[dir]=true},up=e=>{e.preventDefault();keys[dir]=false};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))}bindMove('left','ArrowLeft');bindMove('right','ArrowRight');
function spawn(){const hazard=Math.random()<Math.min(.24,.13+(level-1)*.012);items.push({x:rand(34,W-34),y:-35,r:hazard?rand(20,25):rand(16,21),vy:rand(190,270)+level*22,rot:rand(0,6.28),spin:rand(-2.2,2.2),type:hazard?(Math.random()<.54?'bomb':'rock'):(Math.random()<.68?'star':'coin')})}function burst(x,y,color,n=12){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(55,220);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.35,.8),max:.8,color,size:rand(2,5)})}}
function update(dt){elapsed+=dt;if(state==='playing'){let d=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);if(d)player.target=Math.max(52,Math.min(W-52,player.target+d*player.speed*dt));player.x+=(player.target-player.x)*Math.min(1,dt*13);player.x=Math.max(52,Math.min(W-52,player.x));spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.31,.82-(level-1)*.035)+rand(0,.35)}for(let i=items.length-1;i>=0;i--){const o=items[i];o.y+=o.vy*dt;o.rot+=o.spin*dt;if(Math.abs(o.x-player.x)<player.w*.43+o.r*.48&&o.y+o.r>player.y-15&&o.y-o.r<player.y+player.h*.42){if(o.type==='bomb'||o.type==='rock'){if(!player.hitUntil||elapsed>player.hitUntil){lives--;player.hitUntil=elapsed+1.25;shake=.35;burst(o.x,o.y,'#ff778e',17);updateHud();if(lives<=0)endGame()}}else{score+=o.type==='star'?1:2;burst(o.x,o.y,o.type==='star'?'#ffde81':'#63e5d4',9);updateHud()}items.splice(i,1);continue}if(o.y>H+40)items.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=210*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}shake=Math.max(0,shake-dt)}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#192044');g.addColorStop(.58,'#292450');g.addColorStop(1,'#56345d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const glow=ctx.createRadialGradient(765,110,5,765,110,180);glow.addColorStop(0,'#ffd9a52a');glow.addColorStop(1,'#ffd9a500');ctx.fillStyle=glow;ctx.fillRect(570,0,390,300);ctx.fillStyle='#ffe9be';ctx.globalAlpha=.78;ctx.beginPath();ctx.arc(765,110,26,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;for(let i=0;i<60;i++){let x=(i*173+42)%W,y=(i*97+21)%340,tw=.35+.55*(Math.sin(elapsed*1.6+i*2.7)*.5+.5);ctx.globalAlpha=tw;ctx.fillStyle=i%7===0?'#ffd88a':'#dce4ff';ctx.beginPath();ctx.arc(x,y,i%7===0?2:1.35,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#25254c';ctx.beginPath();ctx.moveTo(0,410);for(let x=0;x<=W;x+=80)ctx.quadraticCurveTo(x+40,360+Math.sin(x*.018)*22,x+80,410);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#202246';ctx.beginPath();ctx.moveTo(0,450);for(let x=0;x<=W;x+=100)ctx.quadraticCurveTo(x+50,405+Math.sin(x*.013+2)*20,x+100,450);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();const floor=ctx.createLinearGradient(0,460,0,H);floor.addColorStop(0,'#342b55');floor.addColorStop(1,'#1c2041');ctx.fillStyle=floor;ctx.fillRect(0,468,W,72);ctx.strokeStyle='#ffcf7040';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,468);ctx.lineTo(W,468);ctx.stroke()}
function starPath(x,y,r,inner){ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,q=i%2?inner:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}ctx.closePath()}function drawItem(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);const bad=o.type==='bomb'||o.type==='rock',gl=ctx.createRadialGradient(0,0,2,0,0,o.r*2.3);gl.addColorStop(0,bad?'#ff778e35':'#ffdc783d');gl.addColorStop(1,'#ffffff00');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,o.r*2.3,0,Math.PI*2);ctx.fill();if(o.type==='star'){const g=ctx.createLinearGradient(-o.r,-o.r,o.r,o.r);g.addColorStop(0,'#fff5b8');g.addColorStop(.5,'#ffcf55');g.addColorStop(1,'#f49d48');ctx.fillStyle=g;ctx.shadowColor='#ffd15a';ctx.shadowBlur=15;starPath(0,0,o.r,o.r*.46);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff9d8';ctx.beginPath();ctx.arc(-4,-6,2.5,0,Math.PI*2);ctx.fill()}else if(o.type==='coin'){ctx.shadowColor='#ffcf55';ctx.shadowBlur=14;const g=ctx.createLinearGradient(-o.r,0,o.r,0);g.addColorStop(0,'#d98737');g.addColorStop(.25,'#ffe584');g.addColorStop(.65,'#ffbd42');g.addColorStop(1,'#f18d32');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,o.r*.77,o.r,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff0a6';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,o.r*.48,o.r*.72,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff0a6';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✦',0,1)}else if(o.type==='bomb'){ctx.fillStyle='#27293d';ctx.strokeStyle='#ff8192';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,2,o.r*.82,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#565771';ctx.beginPath();ctx.arc(-6,-5,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffb55d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(4,-o.r*.68);ctx.quadraticCurveTo(10,-o.r-3,15,-o.r*.8);ctx.stroke();ctx.fillStyle='#ffdf76';ctx.beginPath();ctx.arc(16,-o.r*.83,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff8296';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('!',0,5)}else{ctx.fillStyle='#7b7c91';ctx.strokeStyle='#c2c1d0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-o.r*.85,3);ctx.lineTo(-o.r*.57,-o.r*.64);ctx.lineTo(-o.r*.02,-o.r*.92);ctx.lineTo(o.r*.7,-o.r*.55);ctx.lineTo(o.r*.91,.15);ctx.lineTo(o.r*.43,o.r*.78);ctx.lineTo(-o.r*.48,o.r*.7);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#aaa9b8';ctx.beginPath();ctx.ellipse(-4,-6,6,3,-.4,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawBasket(){ctx.save();ctx.translate(player.x,player.y);if(player.hitUntil&&elapsed<player.hitUntil&&Math.floor(elapsed*13)%2===0)ctx.globalAlpha=.35;ctx.fillStyle='#080d27a0';ctx.beginPath();ctx.ellipse(0,55,66,9,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e6a56b';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,4,43,Math.PI,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ffe0a080';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,3,37,Math.PI,Math.PI*2);ctx.stroke();const b=ctx.createLinearGradient(0,0,0,56);b.addColorStop(0,'#f3b76d');b.addColorStop(.28,'#d98953');b.addColorStop(1,'#a95659');ctx.fillStyle=b;ctx.strokeStyle='#ffd49a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-48,3);ctx.quadraticCurveTo(-43,47,-31,53);ctx.quadraticCurveTo(0,61,31,53);ctx.quadraticCurveTo(43,47,48,3);ctx.closePath();ctx.fill();ctx.stroke();ctx.save();ctx.beginPath();ctx.moveTo(-43,8);ctx.quadraticCurveTo(-36,48,-28,49);ctx.quadraticCurveTo(0,56,28,49);ctx.quadraticCurveTo(36,48,43,8);ctx.clip();ctx.strokeStyle='#ffd49399';ctx.lineWidth=3;for(let y=15;y<56;y+=11){ctx.beginPath();ctx.moveTo(-50,y);ctx.quadraticCurveTo(0,y+7,50,y);ctx.stroke()}for(let x=-35;x<=35;x+=13){ctx.beginPath();ctx.moveTo(x,7);ctx.lineTo(x*.72,57);ctx.stroke()}ctx.restore();const rim=ctx.createLinearGradient(-55,0,55,0);rim.addColorStop(0,'#ffdb98');rim.addColorStop(.5,'#fff0bd');rim.addColorStop(1,'#e7a25e');ctx.fillStyle=rim;ctx.strokeStyle='#b87355';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,5,52,10,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#633e57';ctx.beginPath();ctx.ellipse(0,5,43,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff0ce';ctx.beginPath();ctx.arc(-10,30,2.4,0,Math.PI*2);ctx.arc(10,30,2.4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff0ce';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,31,8,.22,Math.PI-.22);ctx.stroke();ctx.restore()}function draw(){ctx.save();if(shake>0)ctx.translate(rand(-shake*12,shake*12),rand(-shake*8,shake*8));drawBackground();for(const o of items)drawItem(o);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*Math.max(.2,p.life/p.max),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;drawBasket();ctx.restore()}function loop(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
